<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="Style.css" />
    <title>weather forecasting</title>
  </head>

  <body onload="initPage()">
    <div class="bg-photo"></div>
    <div class="bg-tint"></div>

    <div class="container py-5">
      <div class="row mb-5">
        <div class="col-12">
          <div class="brand">Anthony <span>Weather Forecast</span></div>
        </div>
      </div>

      <div class="row mb-2">
        <div class="col-12 col-md-8 mb-2 mb-md-0">
          <input
            type="text"
            class="form-control form-control-lg"
            placeholder="Your city"
            id="city"
          />
        </div>
        <div class="col-12 col-md-4">
          <button
            onclick="generat()"
            type="submit"
            class="btn btn-check-weather btn-lg w-100"
            id="checkBtn"
          >
            CHECK WEATHER
          </button>
        </div>
      </div>

      <div class="row">
        <div class="col-12">
          <div class="status-line" id="statusLine">&nbsp;</div>
        </div>
      </div>

      <div class="row">
        <div class="col-12">
          <div class="recent-wrap" id="recentWrap">
            <span class="recent-label">Recent</span>
            <div id="recentChips" style="display: contents"></div>
          </div>
        </div>
      </div>

      <div class="row stats-row gy-4" id="statsRow">
        <div class="col-12 col-md-2">
          <div class="stat-label">Temperature</div>
          <div class="stat-value temp-with-icon">
            <img id="weatherIcon" class="weather-icon" src="" alt="" />
            <span id="weather">—</span>
          </div>
        </div>
        <div class="col-12 col-md-2">
          <div class="stat-label">Feels like</div>
          <div class="stat-value" id="feelsLike">—</div>
        </div>
        <div class="col-12 col-md-1">
          <div class="stat-label">Country</div>
          <div class="stat-value" id="country">—</div>
        </div>
        <div class="col-12 col-md-2">
          <div class="stat-label">City</div>
          <div class="stat-value" id="named">—</div>
        </div>
        <div class="col-12 col-md-2">
          <div class="stat-label">Conditions</div>
          <div class="stat-value" id="dep">—</div>
        </div>
        <div class="col-12 col-md-1">
          <div class="stat-label">Humidity</div>
          <div class="stat-value" id="hum">—</div>
        </div>
        <div class="col-12 col-md-2">
          <div class="stat-label">Wind speed</div>
          <div class="stat-value" id="win">—</div>
        </div>
      </div>

      <div class="row forecast-section" id="forecastSection" style="display: none">
        <div class="col-12">
          <div class="stat-label">5-day outlook</div>
          <div class="forecast-strip" id="forecastStrip"></div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="App.js"></script>
  </body>
</html>
